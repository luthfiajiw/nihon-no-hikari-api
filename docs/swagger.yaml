        example: Admin
        type: string
      success:
        example: true
        type: boolean
    type: object
  internal_admin.PreviewRequest:
    properties:
      content:
        type: object
    type: object
  internal_admin.PreviewResponse:
    properties:
      data:
        type: object
      success:
        example: true
        type: boolean
    type: object
  internal_admin.PublishResponse:
    properties:
      id:
        description: Hanya untuk question_set; dapat berubah saat versi baru diterbitkan.
