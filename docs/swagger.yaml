info:
  contact: {}
  description: REST API untuk platform pembelajaran Nihon no Hikari.
  title: Nihon no Hikari API
  version: "1.0"
paths:
  /auth/register:
    post:
      consumes:
      - application/json
      description: Membuat akun pengguna baru.
      parameters:
      - description: Data registrasi
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_auth.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/nihon-no-hikari-api_pkg_utils.SuccessRes'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/nihon-no-hikari-api_pkg_utils.ErrorRes'
      summary: Registrasi akun
      tags:
      - Auth
  /auth/signin:
    post:
      consumes:
      - application/json
      description: Mengautentikasi pengguna dan membuat sesi baru.
      parameters:
      - description: Kredensial pengguna
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_auth.SignInRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_auth.SignInResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/nihon-no-hikari-api_pkg_utils.ErrorRes'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/nihon-no-hikari-api_pkg_utils.ErrorRes'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/nihon-no-hikari-api_pkg_utils.ErrorRes'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/nihon-no-hikari-api_pkg_utils.ErrorRes'
      summary: Masuk
      tags:
      - Auth
  /auth/signout:
    post:
      consumes:
      - application/json
      description: Menutup sesi pengguna berdasarkan session ID.
      parameters:
      - description: Sesi yang akan ditutup
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_auth.LogoutRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/nihon-no-hikari-api_pkg_utils.SuccessRes'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/nihon-no-hikari-api_pkg_utils.ErrorRes'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/nihon-no-hikari-api_pkg_utils.ErrorRes'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/nihon-no-hikari-api_pkg_utils.ErrorRes'
      summary: Keluar
      tags:
      - Auth
  /auth/token:
    post:
      consumes:
      - application/json
      description: Membuat access token baru menggunakan refresh token.
      parameters:
      - description: Refresh token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_auth.TokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_auth.RefreshTokenResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/nihon-no-hikari-api_pkg_utils.ErrorRes'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/nihon-no-hikari-api_pkg_utils.ErrorRes'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/nihon-no-hikari-api_pkg_utils.ErrorRes'
      summary: Perbarui access token
      tags:
      - Auth
  /courses:
    get:
      description: Mengambil seluruh course yang tersedia.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/nihon-no-hikari-api_internal_course_model.ListCourseResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/nihon-no-hikari-api_pkg_utils.ErrorRes'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/nihon-no-hikari-api_pkg_utils.ErrorRes'
      security:
      - BearerAuth: []
      summary: Daftar course
      tags:
      - Courses
  /courses/{courseId}:
    get:
      description: Mengambil detail course beserta daftar modul dan status progres.
      parameters:
      - description: Course ID
        in: path
        name: courseId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/nihon-no-hikari-api_internal_course_model.CourseDetailResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/nihon-no-hikari-api_pkg_utils.ErrorRes'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/nihon-no-hikari-api_pkg_utils.ErrorRes'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/nihon-no-hikari-api_pkg_utils.ErrorRes'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/nihon-no-hikari-api_pkg_utils.ErrorRes'
      security:
      - BearerAuth: []
      summary: Detail course
      tags:
      - Courses
  /courses/{courseId}/modules/{moduleId}/progress:
    put:
      consumes:
      - application/json
      description: Membuat atau memperbarui progres modul milik pengguna.
      parameters:
      - description: Course ID
        in: path
        name: courseId
        required: true
        type: string
      - description: Module ID
        in: path
        name: moduleId
        required: true
        type: string
      - description: Progres modul
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/nihon-no-hikari-api_internal_course_model.UpsertModuleProgressRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/nihon-no-hikari-api_internal_course_model.ModuleProgressResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/nihon-no-hikari-api_pkg_utils.ErrorRes'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/nihon-no-hikari-api_pkg_utils.ErrorRes'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/nihon-no-hikari-api_pkg_utils.ErrorRes'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/nihon-no-hikari-api_pkg_utils.ErrorRes'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/nihon-no-hikari-api_pkg_utils.ErrorRes'
      security:
      - BearerAuth: []
      summary: Perbarui progres modul
      tags:
      - Courses
  /lessons:
    get:
      description: Mengambil lesson yang dikelompokkan berdasarkan modul beserta status
        progres.
      parameters:
      - description: Course ID
        in: query
        name: courseId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/nihon-no-hikari-api_internal_course_model.ListLessonResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/nihon-no-hikari-api_pkg_utils.ErrorRes'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/nihon-no-hikari-api_pkg_utils.ErrorRes'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/nihon-no-hikari-api_pkg_utils.ErrorRes'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/nihon-no-hikari-api_pkg_utils.ErrorRes'
      security:
      - BearerAuth: []
      summary: Daftar lesson course
      tags:
      - Lessons
  /lessons/{lessonId}:
    get:
      description: Mengambil konten lesson dan question set yang terkait.
      parameters:
      - description: Lesson ID
        in: path
        name: lessonId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/nihon-no-hikari-api_internal_course_model.LessonDetailResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/nihon-no-hikari-api_pkg_utils.ErrorRes'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/nihon-no-hikari-api_pkg_utils.ErrorRes'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/nihon-no-hikari-api_pkg_utils.ErrorRes'
        "500":
          description: Internal Server Error
          schema:
