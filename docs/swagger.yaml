basePath: /api/v1
definitions:
  internal_admin.CatalogData:
    properties:
      courses:
        items:
          type: object
        type: array
      lessons:
        description: Lesson hanya memuat id, module_id, title, slug, order_index,
          is_published, dan archived_at.
        items:
          type: object
        type: array
      modules:
        items:
          type: object
        type: array
      question_sets:
        items:
          type: object
        type: array
    type: object
  internal_admin.CatalogResponse:
    properties:
      data:
        $ref: '#/definitions/internal_admin.CatalogData'
      success:
        example: true
        type: boolean
    type: object
  internal_admin.ContentDetailResponse:
    properties:
      data:
        description: Kolom resource sesuai kind; question_set menyertakan questions,
          options, dan is_correct.
        type: object
      draft:
        description: Payload perubahan yang belum diterbitkan, atau null jika tidak
          ada draft.
        type: object
      success:
        example: true
        type: boolean
    type: object
  internal_admin.ContentListResponse:
    properties:
      data:
        description: Kolom resource sesuai kind, tanpa content lesson; course menyertakan
          module_count dan lesson_count.
        items:
          type: object
        type: array
      success:
        example: true
        type: boolean
    type: object
  internal_admin.ContentRequest:
    properties:
      content:
        allOf:
        - $ref: '#/definitions/internal_admin.LessonContent'
        description: Untuk lesson; HTML disanitasi. Jika kosong, content dan tips
          menjadi string kosong.
      cooldown_minutes:
        minimum: 0
        type: integer
      course_id:
        description: Wajib untuk module.
        format: uuid
        type: string
      description:
        description: Untuk course dan module.
        type: string
      estimated_minutes:
        minimum: 0
        type: integer
      is_entry:
        description: Untuk module dan lesson.
        type: boolean
      is_mandatory:
        description: Untuk module.
        type: boolean
      kind:
        description: Field berikut hanya untuk question_set. Kind dan skill wajib
          diisi.
        enum:
        - practice
        - final_exam
        type: string
      lesson_id:
        description: Wajib untuk question_set practice; kosong untuk final_exam.
        format: uuid
        type: string
      lesson_prerequisites:
        description: Daftar UUID lesson prasyarat. [] menghapus semua prasyarat; null/tidak
          dikirim mempertahankan relasi.
        items:
          type: string
        type: array
      level_id:
        description: Wajib untuk course.
        format: uuid
        type: string
      max_attempts:
        description: Null berarti tanpa batas attempt.
        minimum: 1
        type: integer
      module_id:
        description: Wajib untuk lesson atau question_set final_exam; kosong untuk
          practice.
        format: uuid
        type: string
      module_prerequisites:
        description: Daftar UUID module prasyarat. [] menghapus semua prasyarat; null/tidak
          dikirim mempertahankan relasi.
        items:
          type: string
        type: array
      order_index:
        example: 0
        minimum: 0
        type: integer
      passing_score:
        example: 70
        maximum: 100
        minimum: 0
        type: integer
      questions:
        description: Boleh kosong saat menyimpan draft. Saat publish wajib ada soal
          valid.
        items:
          $ref: '#/definitions/internal_admin.questionInput'
        type: array
      shuffle_questions:
        type: boolean
      skill:
        enum:
        - reading
        - writing
        type: string
      slug:
        description: Wajib untuk course, module, dan lesson; huruf kecil, angka, dan
          tanda hubung.
        example: hiragana-dasar
        maxLength: 120
        type: string
      thumbnail_url:
        description: Untuk course; URL HTTP/HTTPS.
        example: https://example.com/thumbnail.png
        type: string
      time_limit_seconds:
        description: Null atau 0 berarti tanpa batas waktu.
        minimum: 0
        type: integer
      title:
        example: Hiragana dasar
        maxLength: 160
        type: string
      total_questions:
        description: Null berarti semua soal; saat publish tidak boleh melebihi jumlah
          soal tersedia.
        minimum: 1
        type: integer
    required:
    - title
    type: object
  internal_admin.CreateResponse:
    properties:
      id:
        format: uuid
        type: string
      success:
        example: true
        type: boolean
    type: object
  internal_admin.LessonContent:
    properties:
      content:
        example: <p>Belajar huruf hiragana.</p>
        type: string
      tips:
        example: Latih setiap hari.
        type: string
    type: object
  internal_admin.Level:
    properties:
      code:
        example: N5
        type: string
      created_at:
        format: date-time
        type: string
      description:
        type: string
      id:
        format: uuid
        type: string
      name:
        type: string
      order_index:
        type: integer
      updated_at:
        format: date-time
        type: string
    type: object
  internal_admin.LevelsResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/internal_admin.Level'
        type: array
      success:
        example: true
        type: boolean
    type: object
  internal_admin.MeResponse:
    properties:
      role:
        enum:
