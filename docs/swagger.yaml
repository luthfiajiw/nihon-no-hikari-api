info:
  contact: {}
  description: REST API untuk platform pembelajaran Nihon no Hikari.
  title: Nihon no Hikari API
  version: "1.0"
paths:
  /admin/catalog:
    get:
      description: Memerlukan role Admin. Mengambil konten termasuk draft dan arsip.
        Jika course_id diisi, hanya modules dan lessons kursus tersebut yang dikembalikan;
        courses dan question_sets berupa array kosong.
      parameters:
      - description: Filter UUID kursus
        format: uuid
        in: query
        name: course_id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_admin.CatalogResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/nihon-no-hikari-api_pkg_utils.ErrorRes'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/nihon-no-hikari-api_pkg_utils.ErrorRes'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/nihon-no-hikari-api_pkg_utils.ErrorRes'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/nihon-no-hikari-api_pkg_utils.ErrorRes'
      security:
      - BearerAuth: []
      summary: Katalog konten admin
      tags:
      - Admin
  /admin/content/{kind}:
    get:
      description: Memerlukan role Admin. Mengambil seluruh resource sesuai kind,
        termasuk yang belum diterbitkan dan diarsipkan, berdasarkan order_index, created_at,
        dan id. Content lesson tidak disertakan; course menyertakan module_count dan
        lesson_count.
      parameters:
      - description: Jenis resource
        enum:
        - course
        - module
        - lesson
        - question_set
        in: path
        name: kind
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_admin.ContentListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/nihon-no-hikari-api_pkg_utils.ErrorRes'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/nihon-no-hikari-api_pkg_utils.ErrorRes'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/nihon-no-hikari-api_pkg_utils.ErrorRes'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/nihon-no-hikari-api_pkg_utils.ErrorRes'
      security:
      - BearerAuth: []
      summary: Daftar konten admin
      tags:
      - Admin Content
    post:
      consumes:
      - application/json
      description: 'Memerlukan role Admin. Membuat resource yang belum diterbitkan.
        Kirim field sesuai kind: course memerlukan level_id dan slug; module memerlukan
        course_id dan slug; lesson memerlukan module_id dan slug. Title wajib untuk
        semua jenis. Question_set memerlukan kind (practice dengan lesson_id saja,
        atau final_exam dengan module_id saja) dan skill (reading/writing); questions
        disimpan sebagai draft dan boleh belum lengkap. Validasi soal lengkap dilakukan
        saat publish.'
      parameters:
      - description: Jenis resource
        enum:
        - course
        - module
        - lesson
        - question_set
        in: path
        name: kind
        required: true
        type: string
      - description: Payload lengkap sesuai jenis resource
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_admin.ContentRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_admin.CreateResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/nihon-no-hikari-api_pkg_utils.ErrorRes'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/nihon-no-hikari-api_pkg_utils.ErrorRes'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/nihon-no-hikari-api_pkg_utils.ErrorRes'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/nihon-no-hikari-api_pkg_utils.ErrorRes'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/nihon-no-hikari-api_pkg_utils.ErrorRes'
      security:
      - BearerAuth: []
      summary: Buat konten admin
      tags:
      - Admin Content
  /admin/content/{kind}/{id}:
    delete:
      description: Memerlukan role Admin. Menghapus resource jika tidak memiliki riwayat
        atau relasi yang menghalangi penghapusan; jika ada, mengarsipkan dan menonaktifkan
        publikasi. Draft dihapus. Respons archived menunjukkan apakah resource diarsipkan.
      parameters:
      - description: Jenis resource
        enum:
        - course
        - module
        - lesson
        - question_set
        in: path
        name: kind
        required: true
        type: string
      - description: UUID resource
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_admin.RemoveResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/nihon-no-hikari-api_pkg_utils.ErrorRes'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/nihon-no-hikari-api_pkg_utils.ErrorRes'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/nihon-no-hikari-api_pkg_utils.ErrorRes'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/nihon-no-hikari-api_pkg_utils.ErrorRes'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/nihon-no-hikari-api_pkg_utils.ErrorRes'
      security:
      - BearerAuth: []
      summary: Hapus atau arsipkan konten admin
      tags:
      - Admin Content
    get:
      description: Memerlukan role Admin. Data berisi resource tersimpan dan draft
        berisi perubahan yang belum diterbitkan, atau null. Content lesson disanitasi.
        Question set menyertakan seluruh soal dan pilihan beserta jawaban benar.
      parameters:
      - description: Jenis resource
        enum:
        - course
        - module
        - lesson
        - question_set
        in: path
        name: kind
        required: true
        type: string
      - description: UUID resource
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_admin.ContentDetailResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/nihon-no-hikari-api_pkg_utils.ErrorRes'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/nihon-no-hikari-api_pkg_utils.ErrorRes'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/nihon-no-hikari-api_pkg_utils.ErrorRes'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/nihon-no-hikari-api_pkg_utils.ErrorRes'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/nihon-no-hikari-api_pkg_utils.ErrorRes'
      security:
      - BearerAuth: []
      summary: Detail konten dan draft admin
      tags:
      - Admin Content
    patch:
      consumes:
      - application/json
      description: Memerlukan role Admin. Kirim payload lengkap sesuai kind seperti
        pada create; PATCH tidak menggabungkan field dengan data lama. Course/module/lesson
        yang sudah terbit disimpan sebagai draft; yang belum terbit diperbarui langsung.
        Question_set selalu menyimpan payload sebagai draft. Respons draft menunjukkan
        apakah resource sudah terbit. Kind, skill, dan penempatan question_set terbit
        tidak dapat diubah; versi belum terbit yang memiliki attempt tidak dapat diedit
        (409).
      parameters:
      - description: Jenis resource
        enum:
        - course
        - module
        - lesson
        - question_set
        in: path
        name: kind
        required: true
        type: string
      - description: UUID resource
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Payload lengkap sesuai jenis resource
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_admin.ContentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_admin.UpdateResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/nihon-no-hikari-api_pkg_utils.ErrorRes'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/nihon-no-hikari-api_pkg_utils.ErrorRes'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/nihon-no-hikari-api_pkg_utils.ErrorRes'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/nihon-no-hikari-api_pkg_utils.ErrorRes'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/nihon-no-hikari-api_pkg_utils.ErrorRes'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/nihon-no-hikari-api_pkg_utils.ErrorRes'
      security:
      - BearerAuth: []
      summary: Perbarui konten admin
      tags:
      - Admin Content
  /admin/content/{kind}/{id}/publish:
    post:
      description: 'Memerlukan role Admin. Menerapkan draft lalu menerbitkan resource;
        arsip harus dipulihkan terlebih dahulu. Question_set wajib memiliki soal valid:
        reading memakai multiple_choice dengan minimal dua pilihan dan tepat satu
        jawaban benar; writing memakai stroke_writing dengan stroke_template_id dan
        tanpa pilihan. Setiap soal memerlukan prompt, poin positif, dan stimulus atau
        template. Menerbitkan perubahan question_set yang sudah terbit membuat versi
        baru dalam lineage yang sama; respons id adalah UUID versi aktif dan dapat
        berbeda dari id permintaan. Konflik versi atau konfigurasi unik menghasilkan
        409.'
      parameters:
      - description: Jenis resource
        enum:
        - course
        - module
        - lesson
        - question_set
        in: path
        name: kind
        required: true
        type: string
      - description: UUID resource
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_admin.PublishResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/nihon-no-hikari-api_pkg_utils.ErrorRes'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/nihon-no-hikari-api_pkg_utils.ErrorRes'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/nihon-no-hikari-api_pkg_utils.ErrorRes'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/nihon-no-hikari-api_pkg_utils.ErrorRes'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/nihon-no-hikari-api_pkg_utils.ErrorRes'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/nihon-no-hikari-api_pkg_utils.ErrorRes'
      security:
      - BearerAuth: []
      summary: Terbitkan konten admin
      tags:
      - Admin Content
  /admin/content/{kind}/{id}/restore:
    post:
      description: Memerlukan role Admin. Menghapus status arsip dan menjadikan resource
        belum diterbitkan. Resource yang tidak ditemukan atau tidak diarsipkan menghasilkan
        404.
      parameters:
      - description: Jenis resource
        enum:
        - course
        - module
        - lesson
        - question_set
        in: path
        name: kind
        required: true
        type: string
      - description: UUID resource
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_admin.StatusResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/nihon-no-hikari-api_pkg_utils.ErrorRes'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/nihon-no-hikari-api_pkg_utils.ErrorRes'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/nihon-no-hikari-api_pkg_utils.ErrorRes'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/nihon-no-hikari-api_pkg_utils.ErrorRes'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/nihon-no-hikari-api_pkg_utils.ErrorRes'
      security:
      - BearerAuth: []
      summary: Pulihkan konten yang diarsipkan
      tags:
      - Admin Content
  /admin/content/{kind}/reorder:
    post:
      consumes:
      - application/json
      description: Memerlukan role Admin. ordered_ids wajib memuat seluruh anak parent,
        termasuk draft dan arsip. Module diurutkan dalam course; lesson dalam module.
        Urutan langsung berlaku tanpa publish. Hanya order_index pada draft dengan
        parent yang sama yang disinkronkan; perubahan materi lainnya dipertahankan.
        Seluruh perubahan disimpan dalam satu transaksi.
      parameters:
      - description: Jenis konten
        enum:
        - module
        - lesson
        in: path
        name: kind
        required: true
        type: string
      - description: Parent dan seluruh ID sesuai urutan baru
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_admin.ReorderRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_admin.StatusResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/nihon-no-hikari-api_pkg_utils.ErrorRes'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/nihon-no-hikari-api_pkg_utils.ErrorRes'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/nihon-no-hikari-api_pkg_utils.ErrorRes'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/nihon-no-hikari-api_pkg_utils.ErrorRes'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/nihon-no-hikari-api_pkg_utils.ErrorRes'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/nihon-no-hikari-api_pkg_utils.ErrorRes'
      security:
      - BearerAuth: []
      summary: Simpan urutan module atau lesson
      tags:
      - Admin Content
  /admin/kotoba/media:
    post:
      consumes:
      - multipart/form-data
      description: Satu file per permintaan. PNG/JPG maksimal 2 MiB; MP3 maksimal
        1 MiB. Preview memakai signed URL selama 15 menit. File yang tidak dipasang
        ke topik dibersihkan setelah 24 jam.
      parameters:
      - description: Jenis media
        enum:
        - cover
        - audio
        in: formData
        name: kind
        required: true
        type: string
      - description: Cover PNG/JPG atau audio MP3
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "201":
